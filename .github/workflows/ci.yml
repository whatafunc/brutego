name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    name: lint · test · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      # -------------------------------------------------------------------
      # Lint — latest golangci-lint with project .golangci.yml
      # -------------------------------------------------------------------
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      # -------------------------------------------------------------------
      # Unit tests  (-race -count 100 as required by the course)
      # -------------------------------------------------------------------
      - name: Unit tests
        run: go test -race -count=100 ./...

      # -------------------------------------------------------------------
      # Build binary
      # -------------------------------------------------------------------
      - name: Build
        run: go build -o bin/anti-bruteforce ./cmd/server
