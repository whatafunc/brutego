name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    name: lint · test · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: |
          go mod tidy
          go mod download

      # -------------------------------------------------------------------
      # Lint — latest golangci-lint with project .golangci.yml
      # -------------------------------------------------------------------
      - name: Install golangci-lint v2
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: golangci-lint
        run: make lint
        # uses: golangci/golangci-lint-action@v6
        # with:
        #   version: latest

      # -------------------------------------------------------------------
      # Unit tests  (-race -count 100 as required by the course)
      # -------------------------------------------------------------------
      - name: Unit tests
        run: go test -race -count=100 ./...

      # -------------------------------------------------------------------
      # Build binary
      # -------------------------------------------------------------------
      - name: Build
        run: go build -o bin/anti-bruteforce ./cmd/server
